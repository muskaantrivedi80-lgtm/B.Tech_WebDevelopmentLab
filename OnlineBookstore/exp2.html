<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>

<body>
    <table border="2" bordercolor="black" width="85%" height="600" align="center" cellspacing="0">
        
        <!-- Heading -->
        <tr height="15%" bgcolor="#d9edf7">
            <th width="20%"><img src="logo.png" alt="Logo" height="80" width="100" align="middle"></th>
            <th colspan="4"><h2>University Online Bookstore</h2></th>
        </tr>

        <!-- Navigation Bar -->
        <tr height="10%" bgcolor="#f5f5f5" align="center">
            <td>Home</td>
            <td>Login</td>
            <td>Registration</td>
            <td>Catalogue</td>
            <td>Cart</td>
        </tr>

        <tr>
            <!-- Left Menu -->
            <td valign="top" bgcolor="#fcfcfc">
                <h3>Branches</h3>
                <ul>
                    <li>CSE</li>
                    <li>ECE</li>
                    <li>EEE</li>
                    <li>CIVIL</li>
                    <li>MECHANICAL</li>
                    <li>CHEMICAL</li>
                </ul>
            </td>
            
            <!-- Login Area -->
            <td colspan="4" align="center" valign="top">
                <br><br>
                <h3>Login Page</h3>
                <form>
                    <table border="0" cellpadding="5">
                        <tr>
                            <td align="right">User Name:</td>
                            <td><input type="text" name="username"></td>
                        </tr>
                        <tr>
                            <td align="right">Password:</td>
                            <td><input type="password" name="password"></td>
                        </tr>
                    </table>
                    <br>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
