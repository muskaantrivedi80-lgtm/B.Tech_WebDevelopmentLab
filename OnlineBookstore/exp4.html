<!DOCTYPE html>
<html>
<head>
    <title>Cart Page</title>
</head>

<body>
    <table border="2" bordercolor="black" width="85%" height="600" align="center" cellspacing="0">
        
        <!-- Heading -->
        <tr height="15%" bgcolor="#d9edf7">
            <th width="20%"><img src="logo.png" alt="Logo" height="80" width="100" align="middle"></th>
            <th colspan="4"><h2>University Online Bookstore</h2></th>
        </tr>

        <!-- Navigation Area -->
        <tr height="10%" bgcolor="#f5f5f5" align="center">
            <td>Home</td>
            <td>Login</td>
            <td>Registration</td>
            <td>Catalogue</td>
            <td>Cart</td>
        </tr>

        <tr>
            <!-- Left Menu -->
            <td valign="top" bgcolor="#fcfcfc">
                <h3>Branches</h3>
                <ul>
                    <li>CSE</li>
                    <li>ECE</li>
                    <li>EEE</li>
                    <li>CIVIL</li>
                    <li>MECHANICAL</li>
                    <li>CHEMICAL</li>
                </ul>
            </td>
            
            <!-- Cart Details (Organized Grid) -->
            <td colspan="4" valign="top" align="center">
                <br>
                <h3>Your Shopping Cart</h3>
                
                <table border="1" bordercolor="black" width="80%" cellpadding="10" cellspacing="0">
                    <tr bgcolor="#f5f5f5">
                        <th align="left">Book name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                    </tr>
                    
                    <tr>
                        <td>Digital Design</td>
                        <td align="center">₹630</td>
                        <td align="center">2</td>
                        <td align="center">₹1260</td>
                    </tr>
                    
                    <tr>
                        <td>Fluid Mechanics</td>
                        <td align="center">₹650</td>
                        <td align="center">1</td>
                        <td align="center">₹650</td>
                    </tr>
                    
                    <tr bgcolor="#f5f5f5">
                        <td><b>Total amount</b></td>
                        <td></td>
                        <td></td>
                        <td align="center"><b>₹1910</b></td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
