<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
</head>

<body>
    <table border="2" bordercolor="black" width="85%" height="600" align="center" cellspacing="0">
        
        <!-- Heading -->
        <tr height="15%" bgcolor="#d9edf7">
            <th width="20%"><img src="logo.png" alt="Logo" height="80" width="100" align="middle"></th>
            <th colspan="4"><h2>University Online Bookstore</h2></th>
        </tr>

        <!-- Navigation Area -->
        <tr height="10%" bgcolor="#f5f5f5" align="center">
            <td>Home</td>
            <td>Login</td>
            <td>Registration</td>
            <td>Catalogue</td>
            <td>Cart</td>
        </tr>

        <tr>
            <!-- Left Menu -->
            <td valign="top" bgcolor="#fcfcfc">
                <h3>Branches</h3>
                <ul>
                    <li>CSE</li>
                    <li>ECE</li>
                    <li>EEE</li>
                    <li>CIVIL</li>
                    <li>MECHANICAL</li>
                    <li>CHEMICAL</li>
                </ul>
            </td>
            
            <!-- Registration Form Area -->
            <td colspan="4" align="center" valign="top">
                <br>
                <h3>Registration Form</h3>
                
                <form>
                    <!-- Inner table to align the form fields neatly -->
                    <table border="0" cellpadding="8">
                        <tr>
                            <td align="right">Name:</td>
                            <td><input type="text" name="name"></td>
                        </tr>
                        <tr>
                            <td align="right">Password:</td>
                            <td><input type="password" name="password"></td>
                        </tr>
                        <tr>
                            <td align="right">E-mail id:</td>
                            <td><input type="text" name="email"></td>
                        </tr>
                        <tr>
                            <td align="right">Phone Number:</td>
                            <td><input type="text" name="phone"></td>
                        </tr>
                        <tr>
                            <td align="right">Sex:</td>
                            <td>
                                <input type="radio" name="sex" value="Male"> Male
                                <input type="radio" name="sex" value="Female"> Female
                            </td>
                        </tr>
                        <tr>
                            <td align="right">Date of birth:</td>
                            <td>
                                <select name="day">
                                    <option>Day</option>
                                    <option>01</option>
                                    <option>02</option>
                                    <option>03</option>
                                </select>
                                <select name="month">
                                    <option>Month</option>
                                    <option>Jan</option>
                                    <option>Feb</option>
                                    <option>Mar</option>
                                </select>
                                <select name="year">
                                    <option>Year</option>
                                    <option>2000</option>
                                    <option>2001</option>
                                    <option>2002</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">Languages known:</td>
                            <td>
                                <input type="checkbox" name="lang" value="English"> English
                                <input type="checkbox" name="lang" value="Telugu"> Telugu
                                <input type="checkbox" name="lang" value="Hindi"> Hindi
                                <input type="checkbox" name="lang" value="Tamil"> Tamil
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="top">Address:</td>
                            <td><textarea name="address" rows="4" cols="30"></textarea></td>
                        </tr>
                    </table>
                    
                    <br>
                    <!-- Buttons -->
                    <input type="submit" value="Register">
                    &nbsp;&nbsp;
                    <input type="reset" value="Clear Form">
                </form>
                <br>
            </td>
        </tr>
    </table>
</body>
</html>
